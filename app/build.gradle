plugins {
    id 'com.android.application'
}

apply plugin: 'org.greenrobot.greendao'

android {
    namespace "com.example.gtj_sd_dg240"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.gtj_sd_dg240"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            keyAlias 'android.keystore'
            keyPassword '123456'
            storeFile file('../android.keystore')
            storePassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES', '/META-INF/LICENSE', '/META-INF/LICENSE.txt', '/META-INF/license.txt', '/META-INF/NOTICE', '/META-INF/NOTICE.txt', '/META-INF/notice.txt', '/META-INF/*.kotlin_module']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        ignoreWarnings true
        disable 'InvalidPackage', 'MissingTranslation'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        aidl false
        renderScript false
        resValues false
        shaders false
    }
}

greendao {
    schemaVersion 1 //数据库版本号
    daoPackage 'com.example.gtj_sd_dg240.functions.database.greenDao.db'
    // 设置DaoMaster、DaoSession、Dao 包名
    targetGenDir 'src/main/java'//设置DaoMaster、DaoSession、Dao目录
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    // Utils
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'commons-codec:commons-codec:1.18.0'

    // RecyclerView Adapter
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'

    //smartrefresh
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.3'

    // Image
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    //retrofit
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    //PickerView
    implementation 'com.contrarywind:Android-PickerView:4.1.9'

    //eventbus
    implementation 'org.greenrobot:eventbus:3.3.1'

    //GreenDao3
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'io.github.yuweiguocn:GreenDaoUpgradeHelper:v2.2.1'

    //倒计时
    implementation 'in.xiandan:count-down-timer:1.0.3'
    //
    implementation 'com.luffykou:android-common-utils:1.1.3'

    implementation 'com.trello.rxlifecycle4:rxlifecycle:4.0.2'
    implementation 'com.trello.rxlifecycle4:rxlifecycle-android:4.0.2'
    //U盘
    api project(path: ':utillibrary')

    // Math
    implementation 'org.apache.commons:commons-math3:3.6.1'
}
