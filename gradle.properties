# Java home for Android Gradle Plugin (requires Java 17+)
#org.gradle.java.home=/Users/wd/Library/Java/JavaVirtualMachines/corretto-17.0.14/Contents/Home

# ==================== JVM 配置 ====================
# JVM 参数优化
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# ==================== 构建性能优化 ====================
# 启用并行构建
org.gradle.parallel=true
# 启用构建缓存
org.gradle.caching=true
# 启用按需配置
org.gradle.configureondemand=true
# 启用文件系统监视（提升增量构建速度）
org.gradle.vfs.watch=true

# ==================== Android 配置 ====================
# AndroidX package structure
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# 关闭 AGP 对非 ASCII（中文）项目路径的检查，避免因路径含中文导致构建中止
# 注意：这是绕过手段，若后续出现 NDK/资源打包等编码相关问题，建议将项目移至纯英文路径
android.overridePathCheck=true

# ==================== 构建优化 ====================
# 非传递 R 类（减少 R 类大小，提升编译速度）
android.nonTransitiveRClass=true
# 禁用构建配置（如果不需要 BuildConfig 类）
android.defaults.buildfeatures.buildconfig=false
# 禁用 aidl（如果不需要）
android.defaults.buildfeatures.aidl=false
# 禁用 renderScript（如果不需要）
android.defaults.buildfeatures.renderscript=false
# 禁用 resValues（如果不需要）
android.defaults.buildfeatures.resvalues=false
# 禁用 shaders（如果不需要）
android.defaults.buildfeatures.shaders=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
